<form class="flex flex-col gap-2"
      [formGroup]="loginForm"
      (ngSubmit)="onSubmit()"
>

  <fieldset class="fieldset">
    <label class="label">Email</label>
    <input type="text" class="input validator" placeholder="Email" formControlName="email" />
  </fieldset>

  <label class="fieldset">
    <span class="label">Password</span>
    <input type="password" class="input validator" placeholder="Contraseña" formControlName="password" />
  </label>

  <button class="btn btn-neutral mt-4" type="submit">Login</button>

  <p class="text-slate-700">
    no tienes cuenta?
    <a routerLink="/auth/register" class="link link-success">crea una aqui</a>
  </p>

</form>

@if(hasError()) {

    <div role="alert" class="alert alert-warning animate-fadeIn, fixed bottom-5 right-5 w-52">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 shrink-0 stroke-current" fill="none" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
      </svg>
      <span>Por favor verifique la informacion ingresada.</span>
    </div>

  }
