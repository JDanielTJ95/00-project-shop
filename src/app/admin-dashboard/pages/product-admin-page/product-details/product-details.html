<h1 class="text-2xl font-bold">{{ product().title }}</h1>
<div class="divider"></div>

<form [formGroup]="productForm" (ngSubmit)="onSubmit()" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
  <!-- Datos generales -->
  <div class="flex flex-col gap-2">
    <!-- <h2 class="text-2xl font-bold h-12">Datos generales</h2> -->
    <input
      type="text"
      placeholder="Título"
      class="input input-bordered w-full"
      formControlName="title"
      [class.border-red-500]="productForm.get('title')?.errors ?? false"
    />
    <form-error-label [control]="productForm.get('title')!" />

    <input type="text"
           placeholder="Slug"
           class="input input-bordered w-full"
           formControlName="slug"
           [class.border-red-500]="productForm.get('slug')?.errors ?? false"
    />
    <form-error-label [control]="productForm.get('slug')!" />

    <textarea
      class="textarea textarea-bordered"
      placeholder="Descripción"
      rows="6"
      formControlName="description"
      [class.border-red-500]="productForm.get('description')?.errors ?? false"
    ></textarea>
    <form-error-label [control]="productForm.get('description')!" />

    <h2 class="text-lg font-bold">Datos de venta</h2>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
      <div>

        <input
          type="number"
          placeholder="Precio"
          class="input input-bordered w-full"
          formControlName="price"
          [class.border-red-500]="productForm.get('price')?.errors ?? false"
        />
        <form-error-label [control]="productForm.get('price')!" />
      </div>

      <input
        type="number"
        placeholder="Inventario"
        class="input input-bordered w-full"
        formControlName="stock"
        [class.border-red-500]="productForm.get('stock')?.errors ?? false"
    />
    <form-error-label [control]="productForm.get('stock')!" />
    </div>

    <!-- tags -->
    <input
      type="text"
      placeholder="Tags"
      class="input input-bordered w-full"
      formControlName="tags"
      [class.border-red-500]="productForm.get('tags')?.errors ?? false"
    />
    <form-error-label [control]="productForm.get('tags')!" />

    <!-- specs -->
    <input
      type="text"
      placeholder="Specs"
      class="input input-bordered w-full"
      formControlName="specs"
      [class.border-red-500]="productForm.get('specs')?.errors ?? false"
    />
    <form-error-label [control]="productForm.get('specs')!" />

    <!-- Botones para el género -->
    <div class="grid grid-cols-3 gap-2">
      <!-- <button class="btn btn-sm btn-outline">Masculino</button> -->
      <button type="button" class="btn btn-sm" (click)="productForm.patchValue({category: 'perfiles'})" [class.btn-neutral]="productForm.value.category === 'perfiles'">Perfiles</button>
      <button type="button" class="btn btn-sm" (click)="productForm.patchValue({category: 'tubulares'})" [class.btn-primary]="productForm.value.category === 'tubulares'">Tubulares</button>
      <button type="button" class="btn btn-sm" (click)="productForm.patchValue({category: 'laminas'})" [class.btn-secondary]="productForm.value.category === 'laminas'">Laminas</button>
      <button type="button" class="btn btn-sm" (click)="productForm.patchValue({category: 'consumibles'})" [class.btn-accent]="productForm.value.category === 'consumibles'">Consumibles</button>
      <button type="button" class="btn btn-sm" (click)="productForm.patchValue({category: 'herrajes'})" [class.btn-info]="productForm.value.category === 'herrajes'">Herrajes</button>
      <button type="button" class="btn btn-sm" (click)="productForm.patchValue({category: 'cerrajeria'})" [class.btn-success]="productForm.value.category === 'cerrajeria'">Cerrajeria</button>
      <button type="button" class="btn btn-sm" (click)="productForm.patchValue({category: 'herramientas'})" [class.btn-warning]="productForm.value.category === 'herramientas'">Herramientas</button>
      <button type="button" class="btn btn-sm" (click)="productForm.patchValue({category: 'pedidos'})" [class.btn-error]="productForm.value.category === 'pedidos'">Pedidos</button>
    </div>

    <!-- <select class="select select-bordered w-full">
      <option value="male">Masculino</option>
      <option value="female">Femenino</option>
      <option value="unisex">Unisex</option>
    </select> -->

    <!-- Types -->
    <div class="grid grid-cols-6 gap-2">
      @for (type of types; track type) {
      <button class="btn btn-sm btn-outline" type="button" (click)="onSizeClicked(type)" [class.btn-info]="productForm.value.types?.includes(type)">{{ type }}</button>
      }
    </div>

  </div>

  <!-- Imágenes -->
  <div class="flex flex-col gap-2">
    <div class="flex justify-end h-12">
      <button class="btn btn-secondary" type="submit">
        Guardar
      </button>
    </div>

    <product-carousel [images]="product().images" />

    <input type="file" class="file-input file-input-bordered w-full mt-4" />
  </div>
</form>
